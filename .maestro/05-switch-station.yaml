appId: ${APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "screen.streams"
- extendedWaitUntil:
    visible: { id: "streams.item.svitle" }
    timeout: 20000
- tapOn:
    id: "nav.live"
- extendedWaitUntil:
    visible: { id: "player.play" }
    timeout: 20000
- tapOn:
    id: "nav.streams"
- assertVisible:
    id: "screen.streams"
- tapOn:
    id: "streams.item.svetloe"
- assertVisible:
    id: "screen.live"
- extendedWaitUntil:
    visible: { id: "player.pause" }
    timeout: 30000
- tapOn:
    id: "player.pause"
- extendedWaitUntil:
    visible: { id: "player.play" }
    timeout: 10000
