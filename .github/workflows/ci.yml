name: CI
on:
  push: { branches: [main, master] }
  pull_request: { types: [opened, synchronize, reopened, labeled] }
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn verify

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: yarn }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Caches are written only from pushes to main/master (the repo default
          # branch is master, PRs merge into main); PR runs read them.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
      - run: yarn install --frozen-lockfile
      - name: Install the NDK pinned in android/build.gradle (the image ships a different one)
        run: |
          NDK=$(sed -nE 's/.*ndkVersion = "([^"]+)".*/\1/p' android/build.gradle)
          test -n "$NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
      - run: ./gradlew :app:assembleSvitleDebug :app:assembleSvetloeDebug :app:assembleSvitleE2e --build-cache
        working-directory: android
      - name: Verify the e2e APK is signed and installable (exit criterion)
        run: |
          APK=android/app/build/outputs/apk/svitle/e2e/app-svitle-e2e.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^package: name='com.svitleradio'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "e2e APK must not be debuggable"
            exit 1
          fi
          unzip -p "$APK" 'classes*.dex' | grep -a -q 'http://10.0.2.2:8484/v2'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" res/xml/network_security_config.xml | grep -q '10.0.2.2'
          DEBUG_APK=android/app/build/outputs/apk/svitle/debug/app-svitle-debug.apk
          if unzip -p "$DEBUG_APK" 'classes*.dex' | grep -a -q '10.0.2.2:8484'; then
            echo "debug APK must not contain the e2e API URL"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: app-svitle-e2e
          path: android/app/build/outputs/apk/svitle/e2e/app-svitle-e2e.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    # Pinned image AND pinned Xcode. The xcode-27 image (macOS 27) is the only hosted
    # runner with Xcode 27; macos-26 stops at Xcode 26.x. Move both deliberately, never
    # via -latest. The Podfile carries the Xcode 27 workarounds RN 0.81 lacks.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: yarn }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.4", bundler-cache: true }
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app && xcodebuild -version
      - run: yarn install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'Gemfile.lock') }}
      - run: bundle exec pod install
        working-directory: ios
      - name: Podfile.lock must be honoured (only the CocoaPods version line may differ)
        run: git diff -I '^COCOAPODS:' --exit-code -- ios/Podfile.lock
      - name: Build Release for the simulator
        run: |
          set -o pipefail
          # This simulator artifact is built only for the e2e-ios job.
          xcodebuild -workspace ios/SvitleRadio.xcworkspace \
            -scheme SvitleRadio -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            API_URL=http://127.0.0.1:8484/v2 \
            build | xcbeautify --renderer github-actions
      - name: Verify the .app is a runnable arm64 simulator bundle (exit criterion)
        run: |
          APP=ios/build/Build/Products/Release-iphonesimulator/SvitleRadio.app
          test -x "$APP/SvitleRadio"
          lipo -info "$APP/SvitleRadio" | grep -q arm64
          test -f "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx org.svitle.app1
          /usr/libexec/PlistBuddy -c 'Print :API_URL' "$APP/Info.plist" | grep -qx 'http://127.0.0.1:8484/v2'
      - name: Zip the .app (artifact zips drop executable bits, ditto keeps them)
        run: ditto -c -k --keepParent ios/build/Build/Products/Release-iphonesimulator/SvitleRadio.app SvitleRadio.app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: SvitleRadio-simulator
          path: SvitleRadio.app.zip
          if-no-files-found: error
          retention-days: 14

  e2e-android:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      {
        MAESTRO_VERSION: "2.11.0",
        MAESTRO_DRIVER_STARTUP_TIMEOUT: "60000",
        API_LEVEL: "36",
        TARGET: google_apis,
        ARCH: x86_64,
        PROFILE: pixel_6,
      }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: app-svitle-e2e, path: e2e-apk }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: scripts/install-maestro.sh
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}-v2
      - name: Create the AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run the Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action runs each script line in its own shell, so the one-retry
          # policy lives in the wrapper script.
          script: scripts/e2e-android-ci.sh e2e-apk/app-svitle-e2e.apk e2e-output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-android-output
          path: |
            e2e-output
            e2e-output-attempt-1
          if-no-files-found: ignore
          retention-days: 14

  e2e-ios:
    needs: ios
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ios-e2e')
    runs-on: xcode-27
    timeout-minutes: 30
    # Maestro's iOS driver default is 120 s (Android: 15 s); one earlier run timed out at that default.
    env: { MAESTRO_VERSION: "2.11.0", MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: SvitleRadio-simulator, path: e2e-app }
      - run: ditto -x -k e2e-app/SvitleRadio.app.zip e2e-app
      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: scripts/install-maestro.sh
      - name: Boot the simulator and install the app
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          UDID=$(xcrun simctl create e2e-iphone "iPhone 17")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" e2e-app/SvitleRadio.app
      - name: Run the Maestro flows
        run: scripts/e2e-ios.sh e2e-output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          { name: e2e-ios-output, path: e2e-output, if-no-files-found: ignore, retention-days: 14 }
